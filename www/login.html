<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Student Profile</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <h1>Student Profile</h1>

    <p>Login to view your profile</p>

</header>


<main>

    <section class="edit-profile">

        <h2>Login</h2>

        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required>


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required>


            <button
                type="submit"
                class="button">

                Login

            </button>

        </form>

        <p id="loginMessage"></p>

    </section>

</main>


<script src="cordova.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>

</body>

</html>
